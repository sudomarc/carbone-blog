name: Validate Carbone Notes

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: carbone-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile publishing and validation scripts
        run: python -m py_compile generate.py scripts/validate_site.py
      - name: Validate canonical posts, RSS, sitemap and SEO signals
        run: python scripts/validate_site.py
