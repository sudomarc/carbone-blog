name: Carbone Notes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carbone-notes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile publishing and validation scripts
        run: python -m py_compile generate.py scripts/validate_site.py
      - name: Validate canonical posts, RSS, sitemap and SEO signals
        run: python scripts/validate_site.py

  build-main:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify publishing code
        run: python -m py_compile generate.py scripts/validate_site.py
      - name: Validate published site
        run: python scripts/validate_site.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

  deploy-main:
    if: ${{ github.event_name == 'push' }}
    needs: build-main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  publish:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Require main for manual publishing
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Publishing is only allowed from main."
            exit 1
          }
      - name: Validate provider configuration
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openrouter/auto' }}
        run: |
          test -n "$OPENROUTER_API_KEY" || {
            echo "ERROR STAGE=CONFIG ERROR TYPE=missing_secret ERROR MESSAGE=OPENROUTER_API_KEY is missing"
            exit 1
          }
          test -n "$NEWS_API_KEY" || {
            echo "ERROR STAGE=CONFIG ERROR TYPE=missing_secret ERROR MESSAGE=NEWS_API_KEY is missing"
            exit 1
          }
          echo "MODEL $OPENROUTER_MODEL"
      - name: Verify API access
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: python generate.py --check-api
      - name: Fetch sources, generate and render article
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openrouter/auto' }}
          OPENROUTER_FALLBACK_MODELS: ${{ vars.OPENROUTER_FALLBACK_MODELS || '' }}
          OPENROUTER_MAX_TOKENS: ${{ vars.OPENROUTER_MAX_TOKENS || '760' }}
          SITE_URL: "https://sudomarc.github.io/carbone-blog"
        run: python generate.py
      - name: Compile and validate generated site
        run: |
          python -m py_compile generate.py scripts/validate_site.py
          python scripts/validate_site.py
      - name: Check generated changes
        run: git diff --check
      - name: Commit and push edition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/ index.html archive.html topics.html feed.xml sitemap.xml
          if git diff --cached --quiet; then
            echo "ERROR STAGE=COMMIT ERROR TYPE=no_changes ERROR MESSAGE=generator produced no publishable changes"
            exit 1
          fi
          git commit -m "Auto-publish Carbone Notes edition"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

  deploy-published:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
